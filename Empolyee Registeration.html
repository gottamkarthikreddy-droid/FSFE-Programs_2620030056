<!DOCTYPE html>
 <html style="background-color: aqua;" >
    <head>

    </head>
    <body align = "center">
        <h1>
            Employee Registration Form
        </h1>
        </p>
        <form action="Target.html" method="get" target="_blank">
            Employee name : <input type="text" name="p1" placeholder="Enter Employee Name" minlength="3" maxlength="9">
            <br><br><br>
            Password : <input type="password" name="p2" placeholder="Enter your password">
            <br><br><br>
            Email : <input type="email" name="p3" placeholder="Enter your email">
            <br><br><br>
            Mobile Number : <input type="number" name="p4" placeholder="Enter your Mobile Number">
            <br><br><br>
            Age : <input type="number" name="p5" placeholder="Enter your Age">
            <br><br><br>
            Date of Birth : <input type="date" name="p6" placeholder="Enter your date of birth">
            <br><br><br>
            Preferred Inteview Time : <input type="time" name="p7">
            <br><br><br>
            Gender : <input type="radio" name="p8" required> Male
                     <input type="radio" name="p8"> Female
                     <br><br><br>
            Skills : <input type="checkbox" name="p9" required multiple> HTML 
                     <input type="checkbox" name="p9-1" multiple> Css
                     <input type="checkbox" name="p9-2" multiple> JavaScript
                     <br><br><br>
            Select Department : <select name="p10" required>
                <option value="1"> CSE</option>
                <option> ECE</option>
                <option> CSE-AI&DS</option>
                <option> CSE-AI&ML</option>
            </select>
            <br><br><br>
            Upload Resume : <input type="file" name="p11" accept=".pdf,.jpg,.png">
            <br><br><br>
            Address : <textarea name="p12" rows="5" cols="50" required placeholder="Enter your address">
            </textarea>
            <br><br><br>
            Work Experience : <input name="p13" type="range" min="1" max="100 ">
            <br><br><br>
            Linkedin Profile : <input name= "p14" type="url" placeholder="Enter Linkedin URL">
            <br><br><br>
            <button type="submit"> Submit</button>
            <button type="reset"> Reset</button>
        </form>

    </body>
 </html>
