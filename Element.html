<!DOCTYPE html>
 <html>
    <head>
        <style>
            p{
                text-align: center;
                color: red;
            }
        </style>
    </head>
    <body>
        <p>
            Every paragraph will be affected by the style
        </p>
        
        <p>
           <b>This one as well</b>
        </p>
            
        
        <p>
           <em>Along with this one</em>
        </p>
        
        
    </body>
 </html>
